function vs(t){const e=document.getElementById("vs");if(e)e.textContent=t}
function speak(t){const s=window.speechSynthesis;if(!s){listen();return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="uk-UA";u.rate=1.1;u.onend=()=>{if(voice)listen()};s.speak(u)}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){vs("Голосове введення не підтримується в цьому браузері. Спробуй Chrome.");voice=false;return}rec=new R();rec.lang="uk-UA";rec.interimResults=false;rec.onstart=()=>vs("🎙 Слухаю... (натисни «Голос», щоб вимкнути)");rec.onresult=e=>{vs("");send(e.results[0][0].transcript)};rec.onerror=e=>{if(e.error=="no-speech"&&voice){listen();return}vs("Браузер блокує мікрофон усередині сторінки ("+e.error+"). Натисни Win+H у полі вводу і диктуй, а «Озвучка» читатиме відповіді вголос.");voice=false};try{rec.start()}catch(e){}}
function toggleVoice(){voice=!voice;if(!voice){try{rec&&rec.abort()}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();vs("");return}listen()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});render();
(function(){const w=document.getElementById("w2");"Quiet Compound".split("").forEach((c,i)=>{const e=document.createElement("span");e.textContent=c==" "?"\u00a0":c;if(i>5)e.style.color="var(--ac)";e.style.animationDelay=(2.7+i*.07)+"s";w.appendChild(e)});const s=document.getElementById("sp");const h=()=>{s.classList.add("x");setTimeout(()=>s.remove(),700)};s.onclick=h;setTimeout(h,4800)})();
</script></body></html>
